[project]
name = "adlosmcp"
version = "1.0.0"
description = "Adlos MCP Host Server & Multi-Host E2EE Control Agent for Ubuntu/Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
adlosmcp = "main:main"
